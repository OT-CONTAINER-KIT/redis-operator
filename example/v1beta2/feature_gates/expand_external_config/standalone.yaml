---
apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: Redis
metadata:
  name: redis-standalone
spec:
  redisConfig:
    additionalRedisConfig: redis-external-config
  kubernetesConfig:
    image: quay.io/opstree/redis:latest
    imagePullPolicy: IfNotPresent
  # EXPAND_EXTERNAL_CONFIG=true makes the init container expand ${VAR}
  # placeholders in the external config before including it. Requires the
  # operator to run with the GenerateConfigInInitContainer feature gate
  # enabled (config is generated by the init container).
  env:
    - name: EXPAND_EXTERNAL_CONFIG
      value: "true"
    - name: MAXMEMORY_POLICY
      value: allkeys-lru
    - name: SLOWLOG_MAX_LEN
      value: "158"
  podSecurityContext:
    runAsUser: 1000
    fsGroup: 1000
  storage:
    volumeClaimTemplate:
      spec:
        # storageClassName: standard
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
  redisExporter:
    enabled: false
    image: quay.io/opstree/redis-exporter:latest
