---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-external-config
data:
  # Redis does not expand environment variables in its config. With
  # EXPAND_EXTERNAL_CONFIG=true the init container expands ${VAR} placeholders
  # against the container env (spec.env) before the file is included, so the
  # same ConfigMap can be reused with per-instance values.
  redis-additional.conf: |
    maxmemory-policy ${MAXMEMORY_POLICY}
    slowlog-max-len ${SLOWLOG_MAX_LEN}
