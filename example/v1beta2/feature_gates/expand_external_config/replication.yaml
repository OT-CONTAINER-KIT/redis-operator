---
apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: RedisReplication
metadata:
  name: redis-replication
spec:
  clusterSize: 3
  redisConfig:
    additionalRedisConfig: redis-external-config
  kubernetesConfig:
    image: quay.io/opstree/redis:latest
    imagePullPolicy: IfNotPresent
  # Requires the operator to run with the GenerateConfigInInitContainer
  # feature gate enabled.
  env:
    - name: EXPAND_EXTERNAL_CONFIG
      value: "true"
    - name: MAXMEMORY_POLICY
      value: allkeys-lru
    - name: SLOWLOG_MAX_LEN
      value: "158"
  podSecurityContext:
    runAsUser: 1000
    fsGroup: 1000
  storage:
    volumeClaimTemplate:
      spec:
        # storageClassName: standard
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
  redisExporter:
    enabled: false
    image: quay.io/opstree/redis-exporter:latest
