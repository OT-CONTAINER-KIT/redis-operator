# Aggregates read access to the Redis CRs into the builtin view, edit and admin roles.
# Credentials are only referenced via secretRefs, never stored in the CRs.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: redis-operator-aggregate-view
  labels:
    rbac.authorization.k8s.io/aggregate-to-view: "true"
    rbac.authorization.k8s.io/aggregate-to-edit: "true"
    rbac.authorization.k8s.io/aggregate-to-admin: "true"
rules:
- apiGroups:
  - redis.redis.opstreelabs.in
  resources:
  - redis
  - redis/status
  - redisclusters
  - redisclusters/status
  - redisreplications
  - redisreplications/status
  - redissentinels
  - redissentinels/status
  verbs:
  - get
  - list
  - watch
