---
apiVersion: redis.redis.opstreelabs.in/v1alpha1
kind: RedisBackup
metadata:
  name: redis-backup-sample
  namespace: default
  labels:
    app.kubernetes.io/name: redisbackup
    app.kubernetes.io/managed-by: redis-operator
spec:
  # Name of the Redis resource in the same namespace to back up.
  # This must be an existing Redis, RedisReplication or RedisCluster.
  redisClusterName: redis-standalone

  # Kind of the resource above. Leave it out to have the operator discover it.
  targetKind: Redis

  # Storage backend — currently supported: s3
  storageType: s3

  s3:
    bucket: my-redis-backups
    region: ap-south-1

    # Name of the Kubernetes Secret holding AWS_ACCESS_KEY_ID and
    # AWS_SECRET_ACCESS_KEY.
    secretName: aws-s3-credentials

    # Point this at any S3-compatible endpoint (for example an in-cluster
    # MinIO) to test without an AWS account:
    # endpoint: "http://minio.minio.svc:9000"

  # Keep the uploaded objects when this resource is deleted. Set to "Delete"
  # to have the operator remove them along with the resource.
  cleanupPolicy: Retain

  retentionDays: 7

  # NOTE: spec.schedule is not implemented and is rejected if set. Create
  # RedisBackup resources from a CronJob for recurring backups.
