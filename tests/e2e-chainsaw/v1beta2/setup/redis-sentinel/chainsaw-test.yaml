---
# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: setup-redis-sentinel
spec:
  steps:
    - try:
        - apply:
            file: replication.yaml
        - assert:
            file: ready-replication-sts.yaml
        - assert:
            file: ready-replication-svc.yaml
        - assert:
            file: ready-replication-pvc.yaml
        - create:
            file: secret.yaml
        - assert:
            file: secret.yaml
        - apply:
            file: sentinel.yaml
        - assert:
            file: ready-sentinel-sts.yaml
        - assert:
            file: ready-sentinel-svc.yaml
        - create:
            file: cli-pod.yaml
        - assert:
            file: cli-pod.yaml
    - name: Wait for the replication and sentinel services to answer
      description: >
        This replaces a flat `sleep 5m` that was ~90% of this case's runtime.
        The ping steps below are the real assertions; this only waits until the
        services have endpoints behind them.
      try:
        - script:
            timeout: 6m
            content: |
              # Runs under /bin/sh via `sh -c`, so keep this POSIX-compatible.
              i=0
              while [ $i -lt 90 ]; do
                if kubectl exec --namespace ${NAMESPACE} redis -- redis-cli \
                     -h redis-replication.${NAMESPACE}.svc -p 6379 ping 2>/dev/null | grep -q PONG &&
                   kubectl exec --namespace ${NAMESPACE} redis -- redis-cli \
                     -h redis-sentinel-sentinel.${NAMESPACE}.svc -p 26379 -a Opstree@1234 ping 2>/dev/null | grep -q PONG; then
                  echo "replication and sentinel services are answering"
                  exit 0
                fi
                i=$((i + 1))
                sleep 4
              done
              echo "timed out waiting for the services to answer"
              exit 1
            check:
              (contains($stdout, 'replication and sentinel services are answering')): true
    - name: Ping Replicated Service from Cli Pod
      try:
        - script:
            timeout: 10s
            content: |
              kubectl exec --namespace ${NAMESPACE} redis -- redis-cli -h redis-replication.${NAMESPACE}.svc -p 6379 ping
            check:
              (contains($stdout, 'PONG')): true
    - name: Ping Sentinel Service from Cli Pod With password
      try:
        - script:
            timeout: 10s
            content: |
              kubectl exec --namespace ${NAMESPACE} redis -- redis-cli -h redis-sentinel-sentinel.${NAMESPACE}.svc -p 26379 -a Opstree@1234 ping
            check:
              (contains($stdout, 'PONG')): true
    - name: Ping Sentinel Service from Cli Pod Without password
      try:
        - script:
            timeout: 10s
            content: |
              kubectl exec --namespace ${NAMESPACE} redis -- redis-cli -h redis-sentinel-sentinel.${NAMESPACE}.svc -p 26379 ping
            check:
              (contains($stdout, 'NOAUTH Authentication required')): true
