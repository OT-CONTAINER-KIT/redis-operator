---
# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: setup-redis-cluster
spec:
  steps:
    - try:
        - apply:
            file: cluster.yaml
        - apply:
            file: secret.yaml
        - apply:
            file: ../../../../data-assert/resources.yaml
        - apply:
            file: ../../../../testdata/additional-config.yaml
        - script:
            timeout: 10s
            content: |
              cat <<EOF | kubectl apply -f -
              ---
              apiVersion: cert-manager.io/v1
              kind: Issuer
              metadata:
                name: selfsigned-issuer
                namespace: ${NAMESPACE}
              spec:
                selfSigned: {}
              ---
              apiVersion: cert-manager.io/v1
              kind: Certificate
              metadata:
                name: redis-tls
                namespace: ${NAMESPACE}
              spec:
                commonName: redis-cluster-v1beta2
                dnsNames:
                  - "*.redis-cluster-v1beta2-leader-headless.${NAMESPACE}.svc.cluster.local"
                  - "*.redis-cluster-v1beta2-follower-headless.${NAMESPACE}.svc.cluster.local"
                issuerRef:
                  name: selfsigned-issuer
                  kind: Issuer
                secretName: redis-tls-cert
              EOF
        - assert:
            file: ready-cluster.yaml
        - assert:
            file: ready-sts.yaml
        - assert:
            file: ready-svc.yaml
        - assert:
            file: ready-pvc.yaml
        - assert:
            file: secret.yaml

    - name: Assert command-line-password-free authentication
      try:
        - script:
            timeout: 30s
            content: |
              #!/bin/bash
              set -e

              # The AvoidCommandLinePassword work makes the operator inject
              # REDISCLI_AUTH into the redis containers and stop passing
              # -a <password> on redis-cli command lines. Verify both halves
              # against a password-protected (and TLS-enabled) cluster.

              # 1. REDISCLI_AUTH must be present on the leader and follower pods.
              #    containers[0] is the redis container; the exporter is separate.
              for role in leader follower; do
                STS="redis-cluster-v1beta2-${role}"
                NAMES=$(kubectl get statefulset "${STS}" -n ${NAMESPACE} \
                  -o jsonpath='{.spec.template.spec.containers[0].env[*].name}')
                echo "${STS} env names: ${NAMES}"
                echo "${NAMES}" | tr ' ' '\n' | grep -qx REDISCLI_AUTH \
                  || { echo "REDISCLI_AUTH missing on ${STS}"; exit 1; }
              done

              # 2. redis-cli must authenticate via REDISCLI_AUTH alone: a PING
              #    with no -a <password> must still succeed. It would return a
              #    NOAUTH error if the env var were not being honoured. TLS flags
              #    are transport-only and do not provide authentication.
              PONG=$(kubectl exec -n ${NAMESPACE} redis-cluster-v1beta2-leader-0 \
                -c redis-cluster-v1beta2-leader -- \
                redis-cli --tls --cacert /tls/ca.crt ping)
              echo "bare PING -> ${PONG}"
              [ "${PONG}" = "PONG" ] || { echo "expected PONG without -a"; exit 1; }

              echo "command-line-password-free authentication verified"
            check:
              (contains($stdout, 'command-line-password-free authentication verified')): true

    - name: Assert cluster preStop failover hook
      try:
        - script:
            timeout: 30s
            content: |
              #!/bin/bash
              set -e

              # The preStop hook is generated by fmt.Sprintf in Go and only ever
              # runs inside a terminating pod, where a syntax error or a missing
              # flag is invisible until a master is killed mid-failover. Assert
              # the rendered script on the real StatefulSet instead.
              for role in leader follower; do
                STS="redis-cluster-v1beta2-${role}"
                HOOK=$(kubectl get statefulset "${STS}" -n ${NAMESPACE} \
                  -o jsonpath='{.spec.template.spec.containers[0].lifecycle.preStop.exec.command[2]}')
                [ -n "${HOOK}" ] || { echo "no preStop hook on ${STS}"; exit 1; }

                # 1. It must be valid POSIX shell -- the container entrypoint is
                #    `sh -c`, so a syntax error means the hook silently no-ops.
                printf '%s' "${HOOK}" > /tmp/prestop-${role}.sh
                sh -n /tmp/prestop-${role}.sh \
                  || { echo "preStop hook on ${STS} is not valid sh"; exit 1; }

                # 2. It must trigger the failover and gate the demotion wait on
                #    the reply, so a declined failover does not burn the whole
                #    grace period and halve the SIGTERM shutdown budget.
                echo "${HOOK}" | grep -q 'cluster failover' \
                  || { echo "${STS} hook does not trigger a failover"; exit 1; }
                echo "${HOOK}" | grep -q 'case "$FAILOVER_RESULT" in' \
                  || { echo "${STS} hook ignores the failover result"; exit 1; }
                echo "${HOOK}" | grep -q 'OK\*) ;;' \
                  || { echo "${STS} hook does not gate the wait on an OK reply"; exit 1; }

                # 3. The demotion wait must be bounded by a deadline derived from
                #    this role's terminationGracePeriodSeconds, leaving 10s of
                #    headroom for the SIGTERM shutdown.
                GRACE=$(kubectl get statefulset "${STS}" -n ${NAMESPACE} \
                  -o jsonpath='{.spec.template.spec.terminationGracePeriodSeconds}')
                WANT=$(( GRACE - 10 ))
                echo "${STS}: grace=${GRACE}s expected wait=${WANT}s"
                echo "${HOOK}" | grep -q "DEADLINE=\$(( \$(date +%s) + ${WANT} ))" \
                  || { echo "${STS} hook wait is not bounded by ${WANT}s"; exit 1; }

                # 4. TLS is enabled on this cluster, so every redis-cli call in
                #    the hook needs the TLS flags or it cannot reach Redis.
                CALLS=$(echo "${HOOK}" | grep -c -- '--tls --cert')
                [ "${CALLS}" -eq 4 ] \
                  || { echo "${STS} hook has ${CALLS}/4 TLS-enabled redis-cli calls"; exit 1; }
              done

              echo "cluster preStop failover hook verified"
            check:
              (contains($stdout, 'cluster preStop failover hook verified')): true

    - name: Assert config
      try:
        - script:
            timeout: 90s
            content: |
              #!/bin/bash
              set -e

              # Check every leader and follower reflects the applied configuration.
              # NB: this content runs under /bin/sh (dash) via `sh -c`, so it must
              # stay POSIX-compatible (no bash-only constructs such as $RANDOM).
              for ROLE in leader follower; do
                for INDEX in 0 1 2; do
                  POD="redis-cluster-v1beta2-${ROLE}-${INDEX}"
                  CMD="kubectl exec -n ${NAMESPACE} ${POD} -c redis-cluster-v1beta2-${ROLE} -- redis-cli --no-auth-warning -a Opstree1234 --tls --cacert /tls/ca.crt"
                  SLOWLOG_VALUE=$(${CMD} config get slowlog-log-slower-than | grep -A1 "slowlog-log-slower-than" | tail -n1)
                  TCP_KEEPALIVE_VALUE=$(${CMD} config get tcp-keepalive | grep -A1 "tcp-keepalive" | tail -n1)
                  if [ "$SLOWLOG_VALUE" != "5000" ]; then
                    echo "${POD} slowlog-log-slower-than value is $SLOWLOG_VALUE, expected 5000"
                    exit 1
                  fi
                  if [ "$TCP_KEEPALIVE_VALUE" != "400" ]; then
                    echo "${POD} tcp-keepalive value is $TCP_KEEPALIVE_VALUE, expected 400"
                    exit 1
                  fi
                done
              done

              echo "All Redis leaders and followers have correct slowlog-log-slower-than and tcp-keepalive configuration"
              exit 0
            check:
              (contains($stdout, 'All Redis leaders and followers have correct')): true

    - name: Check maxmemory
      try:
        - script:
            timeout: 30s
            content: |
              #!/bin/bash
              set -e

              # maxmemory should not equal to 0
              MAXMEMORY=$(kubectl exec -n ${NAMESPACE} redis-cluster-v1beta2-leader-0 -c redis-cluster-v1beta2-leader -- \
              redis-cli --no-auth-warning --tls --cacert /tls/ca.crt -a Opstree1234 config get maxmemory | grep -A1 "maxmemory" | tail -n1)
              if [ "$MAXMEMORY" = "0" ]; then
                echo "maxmemory value is $MAXMEMORY, expected not 0"
                exit 1
              fi
              exit 0

    - name: Put data
      try:
        - script:
            timeout: 90s
            content: >
              kubectl exec --namespace ${NAMESPACE} --container data-assert data-assert --
              bash -c  "cd /go/src/data-assert && go run main.go gen-redis-data --host redis-cluster-v1beta2-leader.${NAMESPACE}.svc.cluster.local:6379 --mode cluster --password Opstree1234 --tls"
            check:
              (contains($stdout, 'OK')): true

    - name: Failover the follower-0 to master
      try:
        - script:
            timeout: 30s
            content: >
              kubectl exec --namespace ${NAMESPACE} redis-cluster-v1beta2-follower-0 -c redis-cluster-v1beta2-follower --
              bash -c  "redis-cli -a Opstree1234 --tls --cacert /tls/ca.crt cluster failover"
            check:
              (contains($stdout, 'OK')): true

    - name: Check follower-0 label updated
      try:
        - sleep:
            duration: 1m
        - script:
            timeout: 30s
            content: >
              kubectl get pod -n ${NAMESPACE} redis-cluster-v1beta2-follower-0 -o jsonpath='{.metadata.labels.redis-role}'
            check:
              (contains($stdout, 'master')): true

    - name: Failover the follower-0 to slave
      try:
        - script:
            timeout: 30s
            content: >
              kubectl exec --namespace ${NAMESPACE} redis-cluster-v1beta2-leader-0 -c redis-cluster-v1beta2-leader --
              bash -c  "redis-cli -a Opstree1234 --tls --cacert /tls/ca.crt cluster failover"
            check:
              (contains($stdout, 'OK')): true
        - sleep:
            duration: 1m

    - name: Scale Out Redis Cluster
      try:
        - apply:
            file: cluster-scale-out.yaml

    - name: Check Status 00
      try:
        - assert:
            file: cluster-scale-out-status-00.yaml

    - name: Check Status 01
      try:
        - assert:
            file: cluster-scale-out-status-01.yaml

    - name: Check Status 02
      try:
        - assert:
            file: cluster-scale-out-status-02.yaml

    - name: Check Status 03
      try:
        - assert:
            file: cluster-scale-out-status-03.yaml

    - name: Assert data
      try:
        - script:
            timeout: 30s
            content: >
              kubectl exec --namespace ${NAMESPACE} --container data-assert data-assert --
              bash -c "cd /go/src/data-assert && go run main.go chk-redis-data --host redis-cluster-v1beta2-leader.${NAMESPACE}.svc.cluster.local:6379 --mode cluster --password Opstree1234 --tls"
            check:
              (contains($stdout, 'OK')): true

    - name: Scale In Redis Cluster
      try:
        - apply:
            file: cluster.yaml
        - assert:
            file: ready-cluster.yaml

    - name: Assert data
      try:
        - script:
            timeout: 30s
            content: >
              kubectl exec --namespace ${NAMESPACE} --container data-assert data-assert --
              bash -c "cd /go/src/data-assert && go run main.go chk-redis-data --host redis-cluster-v1beta2-leader.${NAMESPACE}.svc.cluster.local:6379 --mode cluster --password Opstree1234 --tls"
            check:
              (contains($stdout, 'OK')): true

    - name: redis-cluster-uninstall
      try:
        - delete:
            ref:
              name: redis-cluster-v1beta2
              kind: RedisCluster
              apiVersion: redis.redis.opstreelabs.in/v1beta2
        - error:
            file: ready-cluster.yaml
        - error:
            file: ready-sts.yaml
        - error:
            file: ready-svc.yaml
        - error:
            file: ready-pvc.yaml
