---
redisOperator:
  name: redis-operator
  imageName: quay.io/opstree/redis-operator
  # Overrides the image tag whose default is the chart appVersion.
  imageTag: ""
  # -- initContainerImageTag is the init-config init container image tag.
  # If not specified, defaults to imageTag, then falls back to chart appVersion.
  # Typically only needs to be set when using a different version for the init container.
  initContainerImageTag: "v0.27.0"
  imagePullPolicy: Always
  imagePullSecrets: []

  # Update strategy
  # strategy:
  #   type: RollingUpdate
  #   rollingUpdate:
  #     maxSurge: 25%
  #     maxUnavailable: 25%
  strategy: {}

  # Additional pod annotations
  podAnnotations: {}
  # Additional Pod labels (e.g. for filtering Pod by custom labels)
  podLabels: {}

  # Additional arguments for redis-operator container
  extraArgs: []
  # When not specified, the operator will watch all namespaces. It can be set to a specific namespace or multiple namespaces separated by commas.
  watchNamespace: ""
  # -- The DNS domain suffix used for Kubernetes service discovery.
  # Default is "cluster.local". Change this if your cluster uses a custom DNS domain.
  serviceDNSDomain: "cluster.local"
  env: []
  # If set to true, webhook server will be enabled for masterSlaveAntiAffinity feature
  # Certificate handling:
  # - If certmanager.enabled=true: cert-manager will automatically create and manage the webhook certificate
  # - If certmanager.enabled=false: A self-signed certificate will be automatically generated by Helm
  webhook: false
  automountServiceAccountToken: true

  # pprof configuration for performance profiling
  pprof:
    # Enable pprof server for performance profiling
    enabled: false
    # The address the pprof endpoint binds to
    bindAddress: ":6060"

  # metrics configuration for monitoring
  metrics:
    # Enable metrics server
    enabled: true
    # The address the metrics endpoint binds to
    bindAddress: ":8080"

resources:
  limits:
    cpu: 500m
    memory: 500Mi
  requests:
    cpu: 500m
    memory: 500Mi

replicas: 1

rbac:
  # -- Enable RBAC resources creation
  enabled: true
  # -- RBAC scope: "cluster" for ClusterRole/ClusterRoleBinding or "namespace" for Role/RoleBinding.
  # "cluster" lets the operator manage Redis resources across all namespaces (default behavior).
  # "namespace" restricts the operator to its own release namespace; set redisOperator.watchNamespace
  # accordingly and ensure the CRDs are installed separately (CRDs are cluster-scoped).
  scope: "cluster"
  # -- Aggregate the Redis CRs into the builtin view, edit and admin ClusterRoles.
  # Only rendered when rbac.scope is "cluster".
  aggregate: true
serviceAccountName: redis-operator

serviceAccount:
  automountServiceAccountToken: true

service:
  name: webhook-service
  namespace: redis-operator

certificate:
  name: serving-cert
  secretName: webhook-server-cert

issuer:
  # Whether to create the issuer or not. You might want to disable this if instead you
  # want to use a ClusterIssuer that you simply want to provide.
  create: true
  # You can choose Issuer or ClusterIssuer here. The first one is namespaced, the second one
  # is available for global usage.
  kind: Issuer
  type: selfSigned
  name: redis-operator-issuer
  email: shubham.gupta@opstree.com
  server: https://acme-v02.api.letsencrypt.org/directory
  privateKeySecretName: letsencrypt-prod
  solver:
    enabled: true
    ingressClass: nginx

certmanager:
  # Whether to use cert-manager for certificate management
  # Only effective when webhook=true
  # If webhook=true and certmanager.enabled=false, a self-signed certificate is automatically generated
  enabled: false
  # API version of the cert-manager CRDs
  apiVersion: "cert-manager.io/v1"

priorityClassName: ""
nodeSelector: {}
tolerateAllTaints: false
tolerations: []
affinity: {}

podSecurityContext: {}
#  fsGroup: 2000

securityContext: {}
#  capabilities:
#    drop:
#    - ALL
#  readOnlyRootFilesystem: true
#  runAsNonRoot: true
#  runAsUser: 1000

# -- Feature gates for alpha/experimental features.
# Only set gates that are supported by the deployed operator image; passing an
# unknown gate makes the operator exit at startup.
featureGates: {}
  # Never execute redis-cli -a <password>, even if authentication cannot succeed without it
  # AvoidCommandLinePassword: false
  # Enable generating Redis configuration using an init container instead of a regular container
  # GenerateConfigInInitContainer: false

manager:
  # config values for the operator manager
  config:
    kubeClientTimeout: 60s
    # -- If value > 0, it will override the default value in the operator
    kubeClientQPS: 0.0
    # Set to 0 to use the operator's built-in default.
    maxConcurrentReconciles: 3
    # Accepts a Go duration (e.g. "30s", "5m"). Empty uses the operator's built-in default.
    execCommandTimeout: ""

# A single ServiceMonitor that scrapes the redis-exporter of every matching Redis CR,
# instead of one ServiceMonitor per CR. It selects the `<name>-metrics` Services the
# operator creates when `spec.redisExporter.enabled` is true, so newly created CRs are
# picked up automatically. Requires the Prometheus Operator CRDs.
# When using this, set `serviceMonitor.enabled=false` in the per-CR charts
# (e.g. redis-cluster) to avoid scraping the same targets twice.
fleetServiceMonitor:
  # -- Create one ServiceMonitor for the whole Redis fleet
  enabled: false
  # -- ServiceMonitor name. Defaults to `<release>-redis-fleet`
  name: ""
  # -- Namespace to create the ServiceMonitor in. Defaults to the release namespace
  namespace: ""
  # -- Values of the `redis_setup_type` label to scrape: cluster, standalone, replication, sentinel
  setupTypes:
    - cluster
  # -- Namespaces whose Redis metrics Services are scraped. Empty means the ServiceMonitor's own namespace
  targetNamespaces: []
  # -- Scrape matching Services in every namespace (overrides targetNamespaces)
  allNamespaces: false
  interval: 30s
  scrapeTimeout: 10s
  # -- Extra labels on the ServiceMonitor, e.g. the `release` label your Prometheus selects on
  extraLabels: {}
  # -- Relabelings applied to the scrape endpoint
  relabelings: []
    # Add a redis_cluster label holding the RedisCluster name (service label app=<name>-leader|follower)
    # - sourceLabels: [__meta_kubernetes_service_label_app]
    #   regex: (.+)-(leader|follower)
    #   targetLabel: redis_cluster
  # -- Metric relabelings applied to the scrape endpoint
  metricRelabelings: []
