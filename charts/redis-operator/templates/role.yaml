{{- if .Values.rbac.enabled }}
{{- $scope := include "redis-operator.rbacScope" . }}
---
apiVersion: rbac.authorization.k8s.io/v1
{{- if eq $scope "cluster" }}
kind: ClusterRole
{{- else }}
kind: Role
{{- end }}
metadata:
  name: {{ .Values.redisOperator.name }}
{{- if eq $scope "namespace" }}
  namespace: {{ .Release.Namespace }}
{{- end }}
  labels:
    app.kubernetes.io/name : {{ .Values.redisOperator.name }}
    helm.sh/chart : {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/managed-by : {{ .Release.Service }}
    app.kubernetes.io/instance : {{ .Release.Name }}
    app.kubernetes.io/version : {{ .Chart.AppVersion }}
    app.kubernetes.io/component: role
    app.kubernetes.io/part-of : {{ .Release.Name }}
rules:
{{- if .Values.rbac.minimal }}
  # Least-privilege rule set for a RedisReplication + in-pod Sentinel install.
  # Every resource/verb below maps to an actual controller call; the standalone
  # Redis, RedisCluster and RedisSentinel CRD rules, CRD and namespace access,
  # and nonResourceURLs are removed. Pair with the redisOperator.controllers.*
  # switches to disable the controllers whose CRDs are not installed. All
  # resources are namespaced, so the same set renders valid as either a Role
  # or ClusterRole.
  # RedisReplication CRD and its status/finalizers sub-resources.
- apiGroups:
  - redis.redis.opstreelabs.in
  resources:
  - redisreplications
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - redis.redis.opstreelabs.in
  resources:
  - redisreplications/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - redis.redis.opstreelabs.in
  resources:
  - redisreplications/finalizers
  verbs:
  - update
  # Pods are probed and role-labelled (no create/delete); exec runs REPLICAOF
  # and SENTINEL commands through the kubelet.
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
  - patch
- apiGroups:
  - ""
  resources:
  - pods/exec
  verbs:
  - create
  # The six (+exporter/metrics) operand Services are fully reconciled.
- apiGroups:
  - ""
  resources:
  - services
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
  # Read-only: existingSecret and external config are consumed, never created.
- apiGroups:
  - ""
  resources:
  - secrets
  - configmaps
  verbs:
  - get
  - list
  - watch
  # Events are emitted by the (P1) RedisReplication EventRecorder.
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
  - update
  # PVCs are only grown in place; the StatefulSet owns their create/delete.
- apiGroups:
  - ""
  resources:
  - persistentvolumeclaims
  verbs:
  - get
  - list
  - update
  # Redis and in-pod Sentinel StatefulSets.
- apiGroups:
  - apps
  resources:
  - statefulsets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
  # The operand PodDisruptionBudget.
- apiGroups:
  - policy
  resources:
  - poddisruptionbudgets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
  # Leader election lease; the chart always passes --leader-elect.
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
{{- else }}
- apiGroups:
  - redis.redis.opstreelabs.in
  resources:
  - rediss
  - redisclusters
  - redisreplications
  - redis
  - rediscluster
  - redissentinel
  - redissentinels
  - redisreplication
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
{{- if eq $scope "cluster" }}
# nonResourceURLs and cluster-scoped resources (CRDs) are only valid on a ClusterRole.
- nonResourceURLs:
  - '*'
  verbs:
  - get
- apiGroups:
  - "apiextensions.k8s.io"
  resources:
  - "customresourcedefinitions"
  verbs:
  - "get"
  - "list"
  - "watch"
{{- end }}
- apiGroups:
  - redis.redis.opstreelabs.in
  resources:
  - redis/finalizers
  - rediscluster/finalizers
  - redisclusters/finalizers
  - redissentinel/finalizers
  - redissentinels/finalizers
  - redisreplication/finalizers
  - redisreplications/finalizers
  verbs:
  - update
- apiGroups:
  - redis.redis.opstreelabs.in
  resources:
  - redis/status
  - rediscluster/status
  - redisclusters/status
  - redissentinel/status
  - redissentinels/status
  - redisreplication/status
  - redisreplications/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - ""
  resources:
  - secrets
  - pods/exec
  - pods
  - services
  - configmaps
  - events
  - persistentvolumeclaims
{{- if eq $scope "cluster" }}
  # namespaces is a cluster-scoped resource; only grant it on a ClusterRole.
  - namespaces
{{- end }}
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - apps
  resources:
  - statefulsets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - "coordination.k8s.io"
  resources:
  - leases
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
    - "policy"
  resources:
  - poddisruptionbudgets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
{{- end }}
{{- end }}
