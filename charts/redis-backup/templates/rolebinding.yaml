{{- if and .Values.enabled .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "redis-backup.fullname" . }}
  namespace: {{ default .Release.Namespace .Values.clusterNamespace }}
  labels:
    {{- include "redis-backup.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "redis-backup.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "redis-backup.fullname" . }}
{{- end }}
