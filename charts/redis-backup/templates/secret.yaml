{{- if and .Values.enabled .Values.secret.create -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "redis-backup.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "redis-backup.labels" . | nindent 4 }}
type: Opaque
{{- with .Values.secret.stringData }}
stringData:
  {{- range $k, $v := . }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
{{- end }}
